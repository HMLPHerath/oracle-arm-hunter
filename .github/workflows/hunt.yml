name: Oracle ARM Hunter

on:
  schedule:
    # Hourly safety net in case the chain ever breaks
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual run and automatic instant chain-triggering

# Enforce strictly 1 run at any time (cancels any older/duplicate run automatically)
concurrency:
  group: oracle-arm-hunter-singleton
  cancel-in-progress: true

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Configure OCI Credentials
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_CONFIG }}" > ~/.oci/config
          echo "${{ secrets.OCI_KEY_FILE }}" > ~/.oci/oci_api_key.pem
          # Ensure correct key_file path on GitHub Actions runner
          sed -i "s|key_file=.*|key_file=$HOME/.oci/oci_api_key.pem|g" ~/.oci/config
          chmod 600 ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config

      - name: Run Oracle ARM Hunter Bot
        id: bot
        env:
          MAX_RUN_MINUTES: 25
          RETRY_INTERVAL_MS: 60000
        run: node run_bot.js

      - name: Chain Next Continuous Run
        if: steps.bot.outputs.should_retrigger == 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "🔄 Instantly triggering next 25-minute hunting cycle..."
          curl -s -X POST \
            -H "Authorization: token $GH_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/hunt.yml/dispatches \
            -d '{"ref":"main"}'
          echo "✅ Continuous cycle triggered!"
